<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lower Thirds Studio</title>
<link rel="stylesheet" href="/studio.css">
</head>
<body class="place-air">

<!-- Studio is the redesigned dock. It shares the server, the state and every
     WebSocket message with /control, and nothing else: every id and class here
     is prefixed st- and every localStorage key lt-studio-, so the two pages
     never step on each other.

     The page is a column that never scrolls as a whole. The DECK at the top
     (NEXT preview, air readout, transport) is flex:none and stays put without
     position:fixed or sticky, both of which misbehaved in OBS's browser. Only
     the pane beneath it scrolls. -->
<div id="st-app">

  <div id="st-status">
    <div id="st-status-live">
      <span id="st-pill-onair" class="st-pill">OFF AIR</span>
      <span id="st-dot-pgm" class="st-dot st-dot-amber" hidden title="No program overlay connected — add the Lower Third source, or a Browser Source pointing at /overlay"></span>
      <span id="st-dot-obs" class="st-dot" hidden></span>
      <span id="st-status-spacer"></span>
      <div id="st-place" role="group" aria-label="Place">
        <button id="st-place-air" class="st-seg on" aria-pressed="true">AIR</button>
        <button id="st-place-design" class="st-seg" aria-pressed="false">DESIGN</button>
      </div>
    </div>
    <div id="st-status-offline">Server connection lost — reconnecting…</div>
  </div>

  <div id="st-col-air">
    <div id="st-deck">
      <div id="st-pv-wrap">
        <div id="st-pv-box">
          <iframe id="st-pv-frame" src="/overlay?role=preview&label=off&bg=checker" scrolling="no" title="Next"></iframe>
          <div id="st-pv-hit"></div>
          <div id="st-pv-tag">NEXT</div>
          <button id="st-pv-menu-btn" title="Preview options" aria-haspopup="true">⋯</button>
          <div id="st-pv-menu" hidden>
            <div class="st-menu-row">
              <span class="st-menu-lbl">BG</span>
              <button class="st-bg" data-bg="checker" title="Checkerboard">▦</button>
              <button class="st-bg" data-bg="black" title="Black">■</button>
              <button class="st-bg" data-bg="white" title="White">□</button>
              <button class="st-bg" data-bg="green" title="Green">▩</button>
            </div>
            <button id="st-pv-testanim" class="st-menu-item">▶ test animation</button>
            <button id="st-pv-replay" class="st-menu-item">↻ replay on air</button>
            <button id="st-pv-framing" class="st-menu-item">Framing: STRAP</button>
            <label class="st-menu-item st-menu-check"><input type="checkbox" id="st-anim-master"> animations</label>
          </div>
        </div>
      </div>
      <div id="st-readout">
        <div id="st-readout-air" class="st-ro-line"></div>
        <div id="st-readout-next" class="st-ro-line"></div>
      </div>
      <div id="st-transport">
        <button id="st-hide" title="Animate the lower third off air">HIDE</button>
        <button id="st-primary" title="Put what you see in NEXT on air">SHOW</button>
      </div>
    </div>

    <div id="st-air">
      <div id="st-cue"></div>
      <div id="st-toast-air" class="st-toast-lane"></div>
    </div>
  </div>

  <div id="st-split" title="Drag to resize · double-click to reset"></div>

  <div id="st-design">
    <div id="st-subnav" role="tablist">
      <button class="st-seg on" data-sub="element" aria-pressed="true">ELEMENT</button>
      <button class="st-seg" data-sub="layout" aria-pressed="false">LAYOUT</button>
      <button class="st-seg" data-sub="look" aria-pressed="false">LOOK</button>
      <button class="st-seg" data-sub="presets" aria-pressed="false">PRESETS</button>
    </div>
    <div id="st-dpane">
      <div id="st-sub-element" class="st-sub"></div>
      <div id="st-sub-layout" class="st-sub" hidden></div>
      <div id="st-sub-look" class="st-sub" hidden></div>
      <div id="st-sub-presets" class="st-sub" hidden></div>
    </div>
    <div id="st-toast-design" class="st-toast-lane"></div>
  </div>

</div>

<input type="file" id="st-logo-file" accept="image/*,video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov,.m4v" style="display:none">
<input type="file" id="st-font-file" accept=".ttf,.otf,.woff,.woff2" style="display:none">
<datalist id="st-fontlist"></datalist>

<script src="/studio.js"></script>
</body>
</html>
